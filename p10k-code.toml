# Coding modules from main:starship.toml, without the virtualenv checkmark.
# Plain kind|text records let Powerlevel10k apply colors and separators.
add_newline = false
format = "$c$cpp$cmake$python$php$lua$nodejs$golang$haskell$rust$ruby${custom.latex}$package$aws$docker_context"

[c]
disabled = false
symbol = " "
format = "c|$symbol($version)\n"

[cpp]
disabled = false
symbol = " "
format = "cpp|$symbol($version)\n"

[cmake]
symbol = " "
format = "cmake|$symbol($version)\n"

[python]
symbol = " "
format = "python|$symbol($version)\n"
pyenv_version_name = false
pyenv_prefix = ""

[php]
symbol = " "
format = "php|$symbol($version)\n"

[lua]
symbol = " "
format = "lua|$symbol($version)\n"

[nodejs]
symbol = " "
format = "nodejs|$symbol($version)\n"

[golang]
symbol = " "
format = "golang|$symbol($version)\n"

[haskell]
symbol = " "
format = "haskell|$symbol($version)\n"

[rust]
symbol = " "
format = "rust|$symbol($version)\n"

[ruby]
symbol = " "
format = "ruby|$symbol($version)\n"

[custom.latex]
description = "LaTeX project and pdfLaTeX engine version"
detect_extensions = ["tex", "ltx", "bib", "sty", "cls"]
detect_files = [".latexmkrc", "latexmkrc", "Tectonic.toml"]
command = '''
pdflatex --version 2>/dev/null | awk '/^pdfTeX / { n = split($2, version, "-"); if (n >= 3) printf "v%s", version[n]; exit }'
'''
shell = ["sh"]
symbol = " "
format = "latex|$symbol($output)\n"

[package]
symbol = "📦 "
format = "package|$symbol($version)\n"

[aws]
symbol = " "
format = "aws|$symbol($profile )(\\[$duration\\] )\n"

[docker_context]
symbol = " "
format = "docker|$symbol$context\n"
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
detect_extensions = ["Dockerfile"]
