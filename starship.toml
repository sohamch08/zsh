"$schema" = 'https://starship.rs/config-schema.json'

# Google Material Symbols, using the installed Starship Material Outlined font.
# This is a baseline-adjusted copy of Material Terminal Outlined for Iosevka.
# Codes come from ~/.local/share/fonts/MaterialTerminal/mapping.json.
# The terminal must have this font available as a fallback (configured in fontconfig).
# OS brand logos below still use Nerd Fonts.


add_newline = false

format = "$os$directory$git_branch$git_status$nodejs$rust$golang$php$character"

[line_break]
disabled = true

[directory]
style = "bold cyan"
truncate_to_repo = false
truncation_length = 0
repo_root_style = "purple"
use_logical_path = false
format = "[\U00100200  $path]($style) "
repo_root_format = "[\U00100200  $before_root_path]($style)[$repo_root]($repo_root_style)[$path]($repo_root_style) "

[os]
disabled = false
format = "[$symbol](#89b4fa) "

[os.symbols]
Macos = ""
Fedora = ""
Ubuntu = "󰕈"
Artix = "󰣇"
Arch = "󰣇"
CachyOS = "󰣇"

[git_branch]
symbol = "\U00100625 "
format = "on [$symbol $branch(:$remote_branch)]($style) "
style = "bold dimmed green"

[git_status]
style = "bold red"
format = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead = "[\U0010039E $count](bold cyan)"
behind = "[\U001003A1 $count](bold cyan)"
diverged = "[\U0010039E $ahead_count \U001003A1 $behind_count](bold cyan)"
staged = "[\U001000EF $count](bold green)"
modified = "[\U001000FA $count](bold yellow)"
untracked = "[\U001007D5 $count](bold white)"
deleted = "[\U00100520 $count](bold red)"
conflicted = "[\U00100002 $count](bold red)"

[nodejs]
symbol = "\U0000E718"
format = "[$symbol $version](green) "

[rust]
symbol = "\U000F1617"
format = "[$symbol $version](red) "

[golang]
symbol = "\U0000E7EF"
format = "[$symbol $version](cyan) "

[php]
symbol = "\U0000ED6D"
format = "[$symbol $version](purple) "

[character]
success_symbol = "[\U001002B2](green)"
error_symbol = "[\U001002B2](red)"
vimcmd_symbol = "[\U001002B1](blue)"
