"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'custom1'

format = """
$os$directory\
${custom.giturl}${custom.gitlab}${custom.gitea}${custom.codeberg}\
$git_branch\
$git_status\
$fill\
$c\
$cpp\
$cmake\
$python\
$php\
$lua\
$nodejs\
$golang\
$haskell\
$rust\
$ruby\
$package\
$aws\
$docker_context\
$line_break\
$character"""


[directory]
style = 'bold fg:dark_blue'
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false
repo_root_style = 'green'
use_logical_path = false
repo_root_format = "[$before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($repo_root_style) "

# [directory.substitutions]
# 'HyprLife' = "\u001b[38;2;0;174;239m \u001b[38;2;94;129;172m"
# 'neomutt' = ' '
# 'zsh' = ' '
# 'Research' = ' '
# 'Documents' = '󰈙'
# 'Downloads' = ' '
# 'Music' = ' '
# 'Pictures' = ' '

[os]
disabled = false
format = "[$symbol](blue): "

[os.symbols]
Arch = " "
CachyOS = " "
CentOS = " "
Debian = " "
EndeavourOS = " "
Fedora = " "
Gentoo = " "
Kali = " "
NixOS = " "
Void = " "
Windows = "󰍲 "
Zorin = " "

[git_branch]
style = 'fg:green bg:crust'
symbol = '[](crust) '
# format = '[on](white) [$symbol$branch ]($style)'
format = "  [$symbol$branch]($style)[](crust) "

[git_status]
ahead = "[ $count](bold cyan) "
behind = "[ $count](bold cyan) "
diverged = "[ $ahead_count  $behind_count](bold cyan) "
staged = "[+ $count](bold green) "
modified = "[ $count](bold yellow) "
untracked = "[? $count](bold white) "
deleted = "[󰧧 $count](bold red) "
conflicted = "[󱐋 $count](bold red) "
format = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
# conflicted = '([$all_status$ahead_behind]($style) )'

[custom.giturl]
description = "Display symbol for remote Git server"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=""
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "codeberg" ]]; then
    GIT_REMOTE_SYMBOL=""
elif [[ "$GIT_REMOTE" =~ "gitea" ]]; then
    GIT_REMOTE_SYMBOL=""
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL=" "
else
    GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL "
"""
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
format = "$output"
require_repo = true
ignore_timeout = true

# Render these hosts separately so their icons use the active palette.
[custom.gitlab]
description = "GitLab remote icon"
when = 'case "$(command git ls-remote --get-url 2>/dev/null)" in *github*) false;; *gitlab*) true;; *) false;; esac'
shell = ['sh']
symbol = ''
style = 'peach'
format = '[$symbol]($style)'
require_repo = true

[custom.gitea]
description = "Gitea remote icon"
when = 'case "$(command git ls-remote --get-url 2>/dev/null)" in *github*|*gitlab*|*bitbucket*|*codeberg*) false;; *gitea*) true;; *) false;; esac'
shell = ['sh']
symbol = ''
style = 'green'
format = '[$symbol]($style)'
require_repo = true

[custom.codeberg]
description = "Codeberg remote icon"
when = 'case "$(command git ls-remote --get-url 2>/dev/null)" in *github*|*gitlab*|*bitbucket*) false;; *codeberg*) true;; *) false;; esac'
shell = ['sh']
symbol = ''
style = 'blue'
format = '[$symbol]($style)'
require_repo = true

# [fill]
# symbol = ' '

[c]
style = 'dark_blue'
symbol = " "
format = "[$symbol($version)]($style)"

[cpp]
style = 'dark_blue'
symbol = " "
format = "[$symbol($version)]($style)"

[cmake]
symbol = " "

[python]
style = 'teal'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[lua]
style = 'blue'
symbol = ' '
format = "[$symbol($version)]($style)"

[nodejs]
style = 'green'
symbol = ' '
format = "[$symbol($version)]($style)"

[golang]
style = 'teal'
symbol = ' '
format = "[$symbol($version)]($style)"

[haskell]
style = 'purple'
symbol = ' '
format = "[$symbol($version)]($style)"

[rust]
style = 'peach'
symbol = ' '
format = "[$symbol($version)]($style)"

[ruby]
style = 'red'
symbol = ' '
format = "[$symbol($version)]($style)"

[package]
symbol = '📦 '
style = 'peach'
format = "[$symbol($version)]($style)"

[php]
style = 'purple'
symbol = ' '
format = "[$symbol($version)]($style)"

[aws]
symbol = ' '
style = 'yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[docker_context]
symbol = ' '
style = 'fg:#06969A'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

# [jobs]
# symbol = ' '
# style = 'red'
# number_threshold = 1
# format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:gray'
format = '[$duration]($style)'

[character]
# success_symbol = "[ ❯](green)"
# error_symbol = "[ ❯](red)"
# vimcmd_symbol = "[ ❮](blue)"
success_symbol = "[](green)"
error_symbol = "[](red)"
vimcmd_symbol = "[](blue)"

