"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'nord'
continuation_prompt = "[▸▹ ](dimmed white)"

format = """
$os$directory\
$git_branch\
$git_status\
$line_break\
$character"""

right_format = """
$c
$cpp
$cmake
$python\
$php
$lua\
$nodejs\
$golang\
$haskell\
$rust\
$ruby\
$package\
$aws\
$docker_context\
$jobs\
$cmd_duration"""


[directory]
style = 'bold fg:dark_blue'
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false
repo_root_style = 'green'
use_logical_path = false
repo_root_format = "[$before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($repo_root_style) "

# [directory.substitutions]
# 'HyprLife' = "\u001b[38;2;0;174;239m \u001b[38;2;94;129;172m"
# 'neomutt' = ' '
# 'zsh' = ' '
# 'Research' = ' '
# 'Documents' = '󰈙'
# 'Downloads' = ' '
# 'Music' = ' '
# 'Pictures' = ' '

[os]
disabled = false
format = "[$symbol](#89b4fa): "

[os.symbols]
AIX = " "
AlmaLinux = " "
Alpaquita = " "
Alpine = " "
ALTLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
Bluefin = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = " "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = " "
InstantOS = " "
Ios = "󰀷 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = " "
OpenCloudOS = " "
openEuler = " "
openSUSE = " "
OracleLinux = "󰺡 "
PikaOS = " "
Pop = " "
Raspbian = " "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Redox = "󰀘 "
RockyLinux = " "
Solus = " "
SUSE = " "
Ubuntu = " "
Ultramarine = " "
Unknown = " "
Uos = " "
Void = " "
Windows = "󰍲 "
Zorin = " "

[git_branch]
style = 'fg:green'
symbol = ' '
format = '[on](white) [$symbol$branch ]($style)'

[git_status]
ahead = "[ $count](bold cyan)"
behind = "[ $count](bold cyan)"
diverged = "[ $ahead_count  $behind_count](bold cyan)"
staged = "[+ $count](bold green)"
modified = "[ $count](bold yellow)"
untracked = "[? $count](bold white)"
deleted = "[󰧧 $count](bold red)"
conflicted = "[󱐋 $count](bold red)"
format = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
# conflicted = '([$all_status$ahead_behind]($style) )'

[fill]
symbol = ' '

[c]
style = 'dark_blue'
symbol = " "

[cpp]
style = 'dark_blue'
symbol = " "

[cmake]
symbol = " "

[python]
style = 'teal'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[lua]
style = 'blue'
symbol = ' '

[nodejs]
style = 'green'
symbol = ' '

[golang]
style = 'teal'
symbol = ' '

[haskell]
style = 'purple'
symbol = ' '

[rust]
style = 'orange'
symbol = ' '

[ruby]
style = 'red'
symbol = ' '

[package]
symbol = '󰏗 '
style = 'orange'

[php]
style = 'purple'
symbol = ' '

[aws]
symbol = ' '
style = 'yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[docker_context]
symbol = ' '
style = 'fg:#06969A'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

# [jobs]
# symbol = ' '
# style = 'red'
# number_threshold = 1
# format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:gray'
format = '[$duration]($style)'

[character]
# success_symbol = "[ ❯](green)"
# error_symbol = "[ ❯](red)"
# vimcmd_symbol = "[ ❮](blue)"
success_symbol = "[](green)"
error_symbol = "[](red)"
vimcmd_symbol = "[](blue)"

